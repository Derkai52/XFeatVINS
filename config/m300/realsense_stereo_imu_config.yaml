%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 0
num_of_cam: 2

imu_topic: "/mavros/imu/data_raw"
image0_topic: "/camera/infra1/image_rect_raw"
image1_topic: "/camera/infra2/image_rect_raw"

output_path: "/home/emnavi/GNSS-Denial-UAV-Location/result/takeoff_location_output"

# model_path: "/home/emnavi/GNSS-Denial-UAV-Location/src/vins_fusion/vins_estimator/src/featureTracker/models/xfeat.onnx"
#deep learning feature points weights
extractor_weight_path: "SuperVINS/supervins_estimator/weights_dpl/superpoint.onnx"
matcher_weight_path: "SuperVINS/supervins_estimator/weights_dpl/superpoint_lightglue_fused_cpu.onnx" 

# Bag of Words path
voc_relative_path: "SuperVINS/supervins_loop_fusion/src/ThirdParty/Voc/superpoint1.yml.gz" 

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480

# swarm offset option
x_swarm_offset: 0.0
y_swarm_offset: 0.0

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0  # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

